name: Build & Unit Tests

on:
  pull_request:
  push:
    branches:
      - master
      - feature/combat-upgrade
  workflow_dispatch:

# This repository's Actions policy is "local only": marketplace actions,
# including actions/checkout and actions/setup-dotnet, are blocked and any
# workflow referencing them dies with a startup_failure before the first
# step. Every step below is therefore a plain `run:` script.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Manual stand-in for actions/checkout. GITHUB_REF is refs/pull/N/merge
      # for pull_request events and refs/heads/<branch> for push and
      # workflow_dispatch, so one fetch spelling covers all three triggers.
      - name: Checkout
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout --force FETCH_HEAD

      # The full SWLOR_Haks working tree is ~13 GB (models, music, textures) and
      # does not fit on a hosted runner. The unit suites only read the data
      # folders below (~750 MB), so clone the submodule blob-filtered and
      # sparse-checkout just those. If a future test reads a new SWLOR_Haks
      # folder, add it to the sparse-checkout list here. Toolset/corpus tests
      # that depend on data absent from the runner (a local NWN:EE install,
      # licensed corpus assets, non-sparse hak folders) skip themselves via
      # Assert.Ignore gates rather than failing.
      - name: Sparse-checkout SWLOR_Haks data folders
        run: |
          SUBMODULE_SHA=$(git rev-parse HEAD:SWLOR_Haks)
          git clone --filter=blob:none --no-checkout https://github.com/zunath/SWLOR_Haks SWLOR_Haks
          cd SWLOR_Haks
          git sparse-checkout set sw_2da sw_ability sw_item sw_tlk sw_ui sw_weapon
          git checkout "$SUBMODULE_SHA"

      # Manual stand-in for actions/setup-dotnet, using Microsoft's official
      # install script.
      - name: Setup .NET
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 10.0
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Build solution
        run: dotnet build SWLOR.Game.Server.sln --configuration Release -p:RunPostBuildEvent=Never

      - name: Run server unit tests
        run: dotnet test SWLOR.Game.Server.Tests/SWLOR.Game.Server.Tests.csproj --no-build --configuration Release --logger "console;verbosity=minimal"

      - name: Run CLI unit tests
        run: dotnet test SWLOR.CLI.Tests/SWLOR.CLI.Tests.csproj --no-build --configuration Release --logger "console;verbosity=minimal"

      - name: Run formats unit tests
        run: |
          dotnet test SWLOR.NWN.Formats.Tests/SWLOR.NWN.Formats.Tests.csproj --no-build --configuration Release --logger "console;verbosity=minimal"
          dotnet test SWLOR.NWN.Formats.Corpus.Tests/SWLOR.NWN.Formats.Corpus.Tests.csproj --no-build --configuration Release --logger "console;verbosity=minimal"

      - name: Run toolset unit tests
        run: dotnet test SWLOR.Toolset.Tests/SWLOR.Toolset.Tests.csproj --no-build --configuration Release --logger "console;verbosity=minimal"
