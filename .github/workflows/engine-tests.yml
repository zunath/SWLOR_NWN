# ---------------------------------------------------------------------------
# NOT YET VALIDATED ON GITHUB-HOSTED RUNNERS.
#
# This workflow has not had a successful (or even attempted) run on GitHub
# Actions yet and will likely need iteration before it's green. The most
# probable failure points, in rough order of likelihood:
#
#   1. SWLOR_Haks is a ~13GB git submodule. Checking it out on a
#      GitHub-hosted runner may exceed available disk space and/or the job
#      time budget. `fetch-depth: 1` is used to limit history, but the
#      working tree itself is still ~13GB of binary hak source assets.
#      Splitting the hak set, caching, or a self-hosted runner with more
#      disk may be required.
#   2. The neverwinter.nim Linux release binaries (nwn_erf, nwn_gff) are
#      assumed to be drop-in replacements for the Windows nwn_erf.exe /
#      nwn_gff.exe that SWLOR.CLI's HakBuilder/ModulePacker shell out to.
#      They have not been confirmed to produce byte-identical or even
#      game-compatible output versus the pinned Windows tools in
#      SWLOR_Haks/. CLI argument compatibility (-i/-o/-k/-l/-p, -e/-c/-f/-x)
#      is assumed based on SWLOR.CLI's HakBuilder.cs/ModulePacker.cs but
#      not verified against neverwinter.nim's actual CLI surface.
#   3. Renaming extension-less Linux binaries to *.exe so SWLOR.CLI's
#      hardcoded "nwn_erf.exe"/"nwn_gff.exe" process names resolve is a
#      workaround, not an upstream-supported flow.
#   4. NWN server boot inside the container (NWNX/NWSync/licensing, engine
#      startup timing) has only been exercised via the existing
#      docker-compose.yml dev flow, not in a CI sandbox network context.
#
# Treat early runs as a debugging exercise, not a working pipeline.
# ---------------------------------------------------------------------------

name: Engine Tests

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Substring filter for engine test name/category (SWLOR_ENGINE_TEST_FILTER). Leave blank to run all."
        required: false
        default: ""
  schedule:
    # Nightly, well outside normal contributor hours.
    - cron: "0 9 * * *"
  pull_request:
    branches:
      - feature/combat-upgrade
    paths:
      - "SWLOR.Game.Server/**"
      # The engine tests themselves: a PR touching only test code must still
      # compile and run them.
      - "SWLOR.Game.Server.EngineTests/**"
      - "SWLOR.NWN.API/**"
      - "SWLOR.CLI/**"
      - "Module/**"
      - "SWLOR.Game.Server.sln"
      - ".github/workflows/engine-tests.yml"
      - "scripts/run-engine-tests.sh"
      - "Build/hakbuilder.json"
      # The SWLOR_Haks gitlink: a submodule pointer bump changes the hak
      # assets this job packs and deploys.
      - "SWLOR_Haks"

permissions:
  contents: read

env:
  # Pinned release + checksum: `releases/latest` would make the CI input
  # mutable and untrusted. Recompute the checksum when bumping the version:
  #   curl -sL --fail -o nw.zip <url> && sha256sum nw.zip
  NEVERWINTER_NIM_RELEASE_URL: https://github.com/niv/neverwinter.nim/releases/download/2.1.2/neverwinter-x86_64-linux-gnu.zip
  NEVERWINTER_NIM_SHA256: f9cc2e50fbe6f750954d11b824434a92b12913cc0a3442e95dcc5eefd4ddc387
  MOD_FILE_NAME: "Star Wars LOR v2.mod"

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    # Generous timeout: submodule checkout, hak packing, and the module pack
    # over ~443 areas + ~2000 blueprints are all slow on a cold runner.
    # Must stay comfortably ABOVE the runner script's own --timeout-minutes below.
    # If GitHub cancels the job first, the script never tears the stack down or
    # prints its timeout diagnosis, and a hang looks like an unexplained job kill.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build server and CLI
        # SWLOR.CLI references SWLOR.Game.Server (and it references
        # SWLOR.NWN.API), so this single build produces every output dir we
        # need: SWLOR.CLI/bin/... for packing, SWLOR.Game.Server/bin/... for
        # the deployed assembly.
        # RunPostBuildEvent=Never is the repo-required guard against the post-build
        # deploy step; -p:OS=Unix also suppresses it today, but pass the property
        # explicitly so a change to the OS override or target condition cannot
        # silently reintroduce the slow deployment step.
        run: dotnet build SWLOR.CLI/SWLOR.CLI.csproj -c Release -p:OS=Unix -p:RunPostBuildEvent=Never

      - name: Download neverwinter.nim tools
        # Provides Linux nwn_erf/nwn_gff/nwn_tlk. SWLOR.CLI's HakBuilder and
        # ModulePacker hard-code the process names "nwn_erf.exe"/"nwn_gff.exe"
        # (see SWLOR.CLI/HakBuilder.cs, SWLOR.CLI/ModulePacker.cs), and
        # resolve them from the directory containing SWLOR.CLI.dll first
        # (AppContext.BaseDirectory) regardless of the working directory a
        # given command runs from. So: download once, rename with the .exe
        # suffix those call sites expect (Linux does not care about the
        # extension, only the executable bit), and drop them next to
        # SWLOR.CLI.dll.
        run: |
          set -euo pipefail
          curl -sL --fail -o /tmp/neverwinter.zip "$NEVERWINTER_NIM_RELEASE_URL"
          echo "$NEVERWINTER_NIM_SHA256  /tmp/neverwinter.zip" | sha256sum --check --strict
          mkdir -p /tmp/neverwinter
          unzip -q /tmp/neverwinter.zip -d /tmp/neverwinter

          CLI_BIN="SWLOR.CLI/bin/Release/net10.0"
          for tool in nwn_erf nwn_gff nwn_tlk; do
            cp "/tmp/neverwinter/$tool" "$CLI_BIN/$tool.exe"
            chmod +x "$CLI_BIN/$tool.exe"
          done

      - name: Build hak files
        # Mirrors SWLOR_Haks/BuildHaks.cmd (`NWN.FinalFantasy.CLI.exe -k`),
        # but via SWLOR.CLI's cross-platform HakBuilder and Build/hakbuilder.json
        # -- the same folder -> hak mapping used by the Windows deploy tools,
        # just retargeted from ../debugserver/ to ../SWLOR.Game.Server/Docker/
        # so the output lands where docker-compose.enginetests.yml expects it.
        # This edits the checked-out (ephemeral CI) copy only.
        run: |
          set -euo pipefail
          jq '.OutputPath = "../SWLOR.Game.Server/Docker/"' Build/hakbuilder.json > Build/hakbuilder.json.tmp
          mv Build/hakbuilder.json.tmp Build/hakbuilder.json
          cd Build
          dotnet ../SWLOR.CLI/bin/Release/net10.0/SWLOR.CLI.dll --hak

      - name: Pack module
        # Mirrors Module/PackModule.cmd (`SWLOR.CLI.exe -p ".\Star Wars LOR v2.mod"`).
        run: |
          set -euo pipefail
          cd Module
          dotnet ../SWLOR.CLI/bin/Release/net10.0/SWLOR.CLI.dll --pack "./$MOD_FILE_NAME"
          mkdir -p ../SWLOR.Game.Server/Docker/modules
          cp "./$MOD_FILE_NAME" "../SWLOR.Game.Server/Docker/modules/$MOD_FILE_NAME"

      - name: Stage server and engine-test assemblies
        # Build the engine-test project (it pulls in SWLOR.Game.Server as a project
        # reference, so its output holds both assemblies) and stage that into the
        # server home's dotnet/ directory, then run the script with --skip-build so
        # nothing is compiled twice. The game project's own output deliberately
        # excludes the test assembly - that is what keeps test code out of a
        # production deploy.
        run: |
          set -euo pipefail
          dotnet build SWLOR.Game.Server.EngineTests/SWLOR.Game.Server.EngineTests.csproj -c Release -p:OS=Unix -p:RunPostBuildEvent=Never
          rm -rf SWLOR.Game.Server/Docker/dotnet
          mkdir -p SWLOR.Game.Server/Docker/dotnet
          # Game output first: a referenced project's DLL is copied into the referencing
          # project's output but its runtimeconfig.json/deps.json are not, and the NWNX .NET
          # host boots by the GAME assembly's name. The engine-test output layers on top.
          cp -r SWLOR.Game.Server/bin/Release/net10.0/. SWLOR.Game.Server/Docker/dotnet/
          cp -r SWLOR.Game.Server.EngineTests/bin/Release/net10.0/. SWLOR.Game.Server/Docker/dotnet/
          test -f SWLOR.Game.Server/Docker/dotnet/SWLOR.Game.Server.EngineTests.dll
          test -f SWLOR.Game.Server/Docker/dotnet/SWLOR.Game.Server.runtimeconfig.json

      - name: Run engine tests
        # The dispatch input goes through env rather than direct ${{ }} shell
        # interpolation so a crafted filter value cannot inject shell syntax.
        env:
          ENGINE_TEST_FILTER: ${{ inputs.filter }}
        run: |
          set -euo pipefail
          # Inner timeout well below the job's 120-minute limit, leaving room for the
          # checkout/build/pack steps that precede this one - so the script's own
          # teardown and timeout diagnosis win the race against a job cancellation.
          scripts/run-engine-tests.sh --skip-build --timeout-minutes 75 --filter "${ENGINE_TEST_FILTER:-}"

      - name: Upload engine test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-test-results
          path: SWLOR.Game.Server/Docker/app_logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload server logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-logs
          path: SWLOR.Game.Server/Docker/logs/**
          if-no-files-found: warn
          retention-days: 14
