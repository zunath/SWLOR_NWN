name: Publish NWN Server Image

run-name: Publish NWN Server Image requested by ${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nwn-server-image
  cancel-in-progress: false

env:
  SERVER_IMAGE: zunath/nwn-dotnet:8193.37.17-1

jobs:
  authorize:
    name: Authorize image publication
    runs-on: ubuntu-latest
    steps:
      - name: Permit only the repository owner
        shell: bash
        env:
          REQUEST_ACTOR: ${{ github.actor }}
          REQUEST_REPOSITORY: ${{ github.repository }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [[ "$REQUEST_REPOSITORY" != "zunath/SWLOR_NWN" ||
                "$REQUEST_ACTOR" != "zunath" ||
                "$TRIGGERING_ACTOR" != "zunath" ]]
          then
            echo "Only zunath may publish the NWN server image." >&2
            exit 1
          fi

          echo "Image publication authorized for zunath."

  publish:
    name: Build and publish immutable image
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested source revision
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to replace an existing versioned image
        shell: bash
        run: |
          if docker buildx imagetools inspect "$SERVER_IMAGE" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image: $SERVER_IMAGE" >&2
            exit 1
          fi

      - name: Build and publish the server image
        uses: docker/build-push-action@v6
        with:
          context: SWLOR.Game.Server/Docker
          file: SWLOR.Game.Server/Docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SERVER_IMAGE }}

      - name: Record the published image
        shell: bash
        run: |
          docker buildx imagetools inspect "$SERVER_IMAGE"
          printf 'Published `%s` from `%s`.\n' \
            "$SERVER_IMAGE" \
            "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
