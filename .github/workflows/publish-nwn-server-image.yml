name: Publish NWN Server Image

run-name: Publish NWN Server Image requested by ${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nwn-server-image
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize image publication
    runs-on: ubuntu-latest
    steps:
      - name: Permit only the repository owner
        shell: bash
        env:
          REQUEST_ACTOR: ${{ github.actor }}
          REQUEST_REPOSITORY: ${{ github.repository }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [[ "$REQUEST_REPOSITORY" != "zunath/SWLOR_NWN" ||
                "$REQUEST_ACTOR" != "zunath" ||
                "$TRIGGERING_ACTOR" != "zunath" ]]
          then
            echo "Only zunath may publish the NWN server image." >&2
            exit 1
          fi

          echo "Image publication authorized for zunath."

  publish:
    name: Build and publish immutable image
    needs: authorize
    runs-on: ubuntu-latest
    # Configure this environment with zunath as its required reviewer and keep
    # the two Docker Hub credentials below as environment secrets only. The
    # approval boundary then lives outside workflow code selected by a branch.
    environment: dockerhub-publish
    steps:
      - name: Check out the requested source revision
        uses: actions/checkout@v4

      - name: Resolve the tracked versioned image
        id: image
        shell: bash
        run: |
          mapfile -t image_lines < scripts/deployment/server-image.txt
          if (( ${#image_lines[@]} != 1 )); then
            echo "scripts/deployment/server-image.txt must contain exactly one line." >&2
            exit 1
          fi

          server_image="${image_lines[0]%$'\r'}"
          if [[ ! "$server_image" =~ ^zunath/nwn-dotnet:[A-Za-z0-9._-]+$ ||
                "$server_image" == *:latest ]]
          then
            echo "Invalid immutable server image: $server_image" >&2
            exit 1
          fi

          printf 'server_image=%s\n' "$server_image" >> "$GITHUB_OUTPUT"
          echo "Publishing $server_image"

      - name: Log in to Docker Hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_PUBLISH_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_PUBLISH_TOKEN }}
        run: |
          docker_config="$RUNNER_TEMP/swlor-docker-auth"
          install -d -m 0700 "$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"
          printf '%s' "$DOCKERHUB_TOKEN" | docker --config "$docker_config" login \
            --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Refuse to replace an existing versioned image
        shell: bash
        env:
          SERVER_IMAGE: ${{ steps.image.outputs.server_image }}
        run: |
          set +e
          probe_output="$(
            docker buildx imagetools inspect "$SERVER_IMAGE" 2>&1
          )"
          probe_status=$?
          set -e

          if (( probe_status == 0 )); then
            echo "Refusing to overwrite existing image: $SERVER_IMAGE" >&2
            exit 1
          fi

          if ! grep -Eqi '(^|[[:space:]:])(manifest unknown|not found)([[:space:]:]|$)' \
            <<< "$probe_output"
          then
            echo "Could not prove that the versioned image is absent; refusing to publish." >&2
            printf '%s\n' "$probe_output" >&2
            exit 1
          fi

          echo "Confirmed that $SERVER_IMAGE does not exist."

      - name: Build the server image
        shell: bash
        env:
          SERVER_IMAGE: ${{ steps.image.outputs.server_image }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag "$SERVER_IMAGE" \
            --file SWLOR.Game.Server/Docker/Dockerfile \
            SWLOR.Game.Server/Docker

      - name: Verify the non-root runtime
        shell: bash
        env:
          SERVER_IMAGE: ${{ steps.image.outputs.server_image }}
        run: |
          configured_user="$(
            docker image inspect \
              --format '{{.Config.User}}' \
              "$SERVER_IMAGE"
          )"

          if [[ "$configured_user" != "1000:1000" ]]; then
            echo "Unexpected configured runtime user: $configured_user" >&2
            exit 1
          fi

          docker run --rm --entrypoint /bin/bash "$SERVER_IMAGE" -lc '
            test "$(id -u)" = 1000
            test "$(id -g)" = 1000
            test -w /nwn/home
            test -w /nwn/run
            test -x /nwn/run-server.sh
          '

      - name: Verify crash capture and restart lifecycle
        shell: bash
        env:
          SERVER_IMAGE: ${{ steps.image.outputs.server_image }}
          SWLOR_CRASH_TEST_IMAGE: swlor-crash-capture-tests:ci
        run: |
          docker build \
            --build-arg SERVER_IMAGE="$SERVER_IMAGE" \
            --tag "$SWLOR_CRASH_TEST_IMAGE" \
            tools/tests/server_crash_capture
          python3 -m unittest tools.tests.test_server_crash_capture -v

      - name: Publish the verified server image
        shell: bash
        env:
          SERVER_IMAGE: ${{ steps.image.outputs.server_image }}
        run: docker push "$SERVER_IMAGE"

      - name: Record the published image
        shell: bash
        env:
          SERVER_IMAGE: ${{ steps.image.outputs.server_image }}
        run: |
          docker buildx imagetools inspect "$SERVER_IMAGE"
          printf 'Published `%s` from `%s`.\n' \
            "$SERVER_IMAGE" \
            "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove registry authentication
        if: always()
        shell: bash
        run: |
          docker --config "$RUNNER_TEMP/swlor-docker-auth" logout || true
          rm -f -- "$RUNNER_TEMP/swlor-docker-auth/config.json"
          rmdir -- "$RUNNER_TEMP/swlor-docker-auth" || true
