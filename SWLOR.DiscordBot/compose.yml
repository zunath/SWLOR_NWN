name: swlor-discord-bot

services:
  database:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: swlor_bot
      POSTGRES_USER: swlor_bot
      POSTGRES_PASSWORD_FILE: /run/secrets/discord_bot_database_password
    secrets:
      - discord_bot_database_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bot-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 1m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "1654:1654"
    read_only: true
    init: true
    environment:
      DISCORD_BOT_TOKEN_FILE: /run/secrets/discord_bot_token
      SWLOR_BOT_DATABASE_PASSWORD_FILE: /run/secrets/discord_bot_database_password
      SWLOR_BOT_DATABASE_HOST: database
      SWLOR_BOT_DATABASE_PORT: "5432"
      SWLOR_BOT_DATABASE_NAME: swlor_bot
      SWLOR_BOT_DATABASE_USER: swlor_bot
      SWLOR_BOT_READY_FILE: /data/bot.ready
    command: ["--config", "/config/bot.json"]
    depends_on:
      database:
        condition: service_healthy
    secrets:
      - discord_bot_token
      - discord_bot_database_password
    volumes:
      - ./bot.json:/config/bot.json:ro
      - bot-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    networks:
      - bot-internal
    healthcheck:
      test: ["CMD", "dotnet", "/app/SWLOR.DiscordBot.dll", "--health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

secrets:
  discord_bot_token:
    file: ./secrets/discord-token.txt
  discord_bot_database_password:
    file: ./secrets/database-password.txt

volumes:
  postgres-data:
  bot-data:

networks:
  bot-internal:
